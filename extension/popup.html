<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            margin: 0;
            background: #fafafa;
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #333;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #ffa500;
            box-shadow: 0 0 4px rgba(255, 165, 0, 0.3);
        }

        button {
            width: 100%;
            padding: 10px;
            background: #ffa500;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #ff9500;
        }

        button:active {
            background: #ff8500;
        }

        .status {
            margin-top: 12px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            min-height: 20px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>

<body>
    <h2>🔥 LeetCode Streak Tracker</h2>

    <div class="form-group">
        <label for="username">LeetCode Username</label>
        <input type="text" id="username" placeholder="your_username">
    </div>

    <button id="syncBtn">Sync Now</button>

    <div id="status" class="status"></div>

    <script src="popup.js"></script>
</body>

</html>
